services:
  postgres:
    image: postgres:16-alpine
    container_name: sowen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sowen
      POSTGRES_PASSWORD: sowen_dev_password
      POSTGRES_DB: sowen
    ports:
      - "5432:5432"
    volumes:
      - sowen_postgres_data:/var/lib/postgresql/data
volumes:
  sowen_postgres_data:
